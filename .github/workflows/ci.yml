name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned, because tests/ui/*.stderr records rustc's exact error text, which changes
      # between releases. Bump it together with `TRYBUILD=overwrite cargo test`.
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy -- -D warnings

      - name: Test
        run: cargo test
